  <style>
    :root {
      --bg: #F5F5C8;
      --green: #1A4731;
      --yellow: #F5E642;
      --muted: #4A5E50;
      --accent: #3CB371;
      --white: #FFFFFF;
      --shadow-sm: 3px 3px 0 var(--green);
      --shadow-md: 4px 4px 0 var(--green);
      --shadow-lg: 6px 6px 0 var(--green);
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { overscroll-behavior: none; background: var(--bg); }
    body { font-family: 'DM Sans', Arial, sans-serif; letter-spacing: -0.01em; }
    h1, h2, h3 { font-family: 'Syne', Arial, sans-serif; text-wrap: balance; }
    p { text-wrap: pretty; }
    .tabular { font-variant-numeric: tabular-nums; }
    .overflow-y-auto { -webkit-overflow-scrolling: touch; }

    /* ── Staple chip ── */
    .staple-chip {
      display: inline-flex; align-items: center; height: 36px;
      padding: 0 14px; background: #FFF59D; border: 1.5px solid var(--green);
      border-radius: 50px; font-size: 13px; color: var(--green); font-weight: 600;
    }

    /* ── Cards ── */
    .tx-card {
      background: var(--white); border: 2px solid var(--green);
      border-radius: 20px; box-shadow: var(--shadow-md);
    }
    .tx-card-dark {
      background: var(--green); border: 2px solid var(--green);
      border-radius: 20px; box-shadow: var(--shadow-md);
    }
    .tx-title { font-family: 'Syne', Arial, sans-serif; color: var(--green); }
    .tx-copy { color: var(--muted); }
    .tx-muted { color: var(--muted); }
    .tx-empty { color: var(--muted); text-align: center; }
    .tx-panel-label {
      font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }
    .tx-overlay-header,
    .tx-overlay-subhead,
    .tx-overlay-footer {
      background: var(--white);
    }
    .tx-overlay-header,
    .tx-overlay-subhead {
      border-bottom: 2px solid var(--green);
    }
    .tx-overlay-footer {
      border-top: 2px solid var(--green);
    }
    .tx-close-btn {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 1.5rem;
    }
    .tx-outline-btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--white); color: var(--green); font-weight: 700;
      border: 2px solid var(--green); border-radius: 9999px;
      box-shadow: var(--shadow-sm); transition: transform 0.1s, box-shadow 0.1s;
    }
    .tx-outline-btn:active { transform: scale(0.97); box-shadow: 1px 1px 0 var(--green); }
    .tx-danger-btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--white); color: #9a3c2d; font-weight: 700;
      border: 2px solid #9a3c2d; border-radius: 9999px;
      box-shadow: 3px 3px 0 #9a3c2d; transition: transform 0.1s, box-shadow 0.1s;
    }
    .tx-danger-btn:active { transform: scale(0.97); box-shadow: 1px 1px 0 #9a3c2d; }
    .tx-input, .tx-textarea, .tx-select {
      width: 100%; border: 2px solid var(--green); border-radius: 12px;
      padding: 0.7rem 0.85rem; font-size: 0.95rem; outline: none;
      background: var(--white); color: var(--green); box-shadow: var(--shadow-sm);
    }
    .tx-textarea { resize: vertical; }
    .tx-input::placeholder, .tx-textarea::placeholder { color: var(--muted); }
    .tx-input:focus, .tx-textarea:focus, .tx-select:focus { transform: translate(-1px, -1px); box-shadow: var(--shadow-md); }
    .tx-check-card {
      background: var(--white); border: 1.5px solid var(--green); border-radius: 12px;
      box-shadow: 2px 2px 0 var(--green);
    }
    .tx-soft-fill { background: #fbf9dc; }
    .tx-image-well {
      background: #fffbe9; border: 2px solid var(--green); border-radius: 16px; box-shadow: var(--shadow-sm);
    }
    .text-gray-800, .text-gray-700 { color: var(--green) !important; }
    .text-gray-500, .text-gray-400, .text-gray-300, .text-gray-600 { color: var(--muted) !important; }
    .bg-gray-50, .bg-gray-100 { background: #fffbe9 !important; }
    .border-gray-200, .border-gray-100 { border-color: var(--green) !important; }
    .focus\:border-green-accent:focus { border-color: var(--green) !important; box-shadow: var(--shadow-sm); }

    /* ── Primary CTA button ── */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--yellow); color: var(--green); font-weight: 700;
      border: 2px solid var(--green); border-radius: 50px;
      box-shadow: var(--shadow-md); transition: transform 0.1s, box-shadow 0.1s;
      font-family: 'DM Sans', Arial, sans-serif;
    }
    .btn-primary:active { transform: scale(0.97); box-shadow: 2px 2px 0 var(--green); }
    @media (hover: hover) {
      .btn-primary:hover { transform: translate(-2px,-2px); box-shadow: var(--shadow-lg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn-primary { transition: none; }
      .btn-primary:hover { transform: none; }
    }

    /* ── Secondary button ── */
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--green); font-weight: 600;
      border: 2px solid var(--green); border-radius: 50px;
      transition: background 0.1s;
    }
    .btn-secondary:active { background: #F5F5C8; }

    /* ── Chips / tags ── */
    .chip-sabji   { background: #FFF59D; border: 1.5px solid var(--green); border-radius: 8px; color: var(--green); font-size: 12px; font-weight: 600; padding: 2px 8px; }
    .chip-curry   { background: #FFF59D; border: 1.5px solid var(--green); border-radius: 8px; color: var(--green); font-size: 12px; font-weight: 600; padding: 2px 8px; }
    .chip-gujarati{ background: #C8F5D0; border: 1.5px solid var(--green); border-radius: 8px; color: var(--green); font-size: 12px; font-weight: 600; padding: 2px 8px; }

    /* ── Tab nav ── */
    .tab-btn.active { color: var(--green); }
    .tab-btn.active .tab-icon { background: var(--yellow); }
    .tab-btn { color: var(--muted); }
    input[type=checkbox] { accent-color: var(--green); }

    /* ── Focus ring ── */
    :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
    button:focus:not(:focus-visible) { outline: none; }

    /* ── Hover affordances ── */
    @media (hover: hover) {
      .sabji-pick-card:hover,
      .week-day-row:hover,
      .ingredient-card:hover,
      .tx-outline-btn:hover,
      .tx-danger-btn:hover {
        transform: translate(-2px,-2px); box-shadow: var(--shadow-lg);
      }
      .add-sabji-btn:hover, .add-gujarati-btn:hover { background: rgba(245,230,66,0.15); }
      #admin-btn:hover { border-color: var(--green); color: var(--green); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sabji-pick-card, .week-day-row { transition: none; }
    }

    /* ── Animations ── */
    .overlay-enter { animation: slideUp 0.22s cubic-bezier(0.32,0.72,0,1); }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast { animation: fadeInOut 2.8s ease forwards; }
    @keyframes fadeInOut {
      0%  { opacity: 0; transform: translateY(8px); }
      12% { opacity: 1; transform: translateY(0); }
      75% { opacity: 1; }
      100%{ opacity: 0; }
    }

    /* ── Overlay root — opaque bg (Tailwind CDN won't reliably style injected nodes) ── */
    .tx-overlay { background-color: #F5F5C8; }

    /* ── Safe area ── */
    #bottom-nav { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pb-nav { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  </style>
</head>

/* ═══════════════════════════════════════════════
   INDEXEDDB — IMAGE STORAGE
═══════════════════════════════════════════════ */
let _db = null;

function initImageDB() {
  return new Promise((resolve, reject) => {
    if (_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_IMAGES)) {
        db.createObjectStore(STORE_IMAGES, { keyPath: 'sabjiId' });
      }
      if (!db.objectStoreNames.contains(STORE_INGREDIENT_IMAGES)) {
        db.createObjectStore(STORE_INGREDIENT_IMAGES, { keyPath: 'name' });
      }
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = () => { console.warn('IndexedDB unavailable'); resolve(null); };
  });
}

function saveImageBlob(sabjiId, blob) {
  return new Promise((resolve, reject) => {
    if (!_db) { reject(new Error('DB not available')); return; }
    const tx = _db.transaction(STORE_IMAGES, 'readwrite');
    tx.objectStore(STORE_IMAGES).put({ sabjiId, blob });
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

function getImageBlob(sabjiId) {
  return new Promise((resolve) => {
    if (!_db) { resolve(null); return; }
    const tx = _db.transaction(STORE_IMAGES, 'readonly');
    const req = tx.objectStore(STORE_IMAGES).get(sabjiId);
    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
    req.onerror = () => resolve(null);
  });
}

function deleteImageBlob(sabjiId) {
  return new Promise((resolve) => {
    if (!_db) { resolve(); return; }
    const tx = _db.transaction(STORE_IMAGES, 'readwrite');
    tx.objectStore(STORE_IMAGES).delete(sabjiId);
    tx.oncomplete = resolve;
    tx.onerror = resolve;
  });
}

function saveIngredientImage(name, blob) {
  return new Promise((resolve, reject) => {
    if (!_db) { reject(new Error('DB not available')); return; }
    const tx = _db.transaction(STORE_INGREDIENT_IMAGES, 'readwrite');
    tx.objectStore(STORE_INGREDIENT_IMAGES).put({ name, blob });
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

function getIngredientImage(name) {
  return new Promise((resolve) => {

function deleteIngredientImage(name) {

   IMAGE COMPRESSION
═══════════════════════════════════════════════ */
async function compressImage(file, maxPx = 800, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxPx || height > maxPx) {
        if (width > height) { height = Math.round(height * maxPx / width); width = maxPx; }
        else { width = Math.round(width * maxPx / height); height = maxPx; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        if (!blob) { reject(new Error('Compression failed')); return; }
        if (blob.size > 900_000 && quality > 0.4) {
          canvas.toBlob(b2 => resolve(b2 || blob), 'image/jpeg', 0.5);
        } else {
          resolve(blob);
        }
      }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    img.src = url;
  });
}

}

}

}

/* ═══════════════════════════════════════════════
   LOCALSTORAGE — INGREDIENTS
═══════════════════════════════════════════════ */
function loadIngredients() {
  try {
    const s = localStorage.getItem(STORAGE_KEY_INGREDIENTS);
    return s ? JSON.parse(s) : null;
  } catch { return null; }
}

function saveIngredients(list) {
  try { localStorage.setItem(STORAGE_KEY_INGREDIENTS, JSON.stringify(list)); }
  catch { showToast('Storage full.', 'error'); }
}

function seedIngredientsIfNeeded() {
  if (loadIngredients()) return;
  const repo = loadSabjiRepo() || DEFAULT_SABJI_REPO;
  const staples = getStaplesSet();
  const seen = new Set();
  const list = [];
  repo.forEach(s => {
    s.mainIngredients.forEach(ing => {
      const key = ing.toLowerCase();
      if (!seen.has(key) && !staples.has(key)) {
        seen.add(key);
        list.push({ name: ing, emoji: INGREDIENT_EMOJI_MAP[key] || '🥗' });
      }
    });
  });
  list.sort((a, b) => a.name.localeCompare(b.name));
  saveIngredients(list);
}

function syncIngredientsFromRepo() {
  const repo = loadSabjiRepo() || [];
  const staples = getStaplesSet();
  const current = loadIngredients() || [];
  const existingNames = new Set(current.map(i => i.name.toLowerCase()));
  let added = false;
  repo.forEach(s => {
    s.mainIngredients.forEach(ing => {
      const key = ing.toLowerCase();
      if (!existingNames.has(key) && !staples.has(key)) {
        existingNames.add(key);
        current.push({ name: ing, emoji: INGREDIENT_EMOJI_MAP[key] || '🥗' });
        added = true;
      }
    });
  });
  if (added) {
    current.sort((a, b) => a.name.localeCompare(b.name));
    saveIngredients(current);
  }
}

/* ═══════════════════════════════════════════════
   LOCALSTORAGE — WEEKLY PLAN
═══════════════════════════════════════════════ */
function getWeekStartDate() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(new Date(d).setDate(diff)).toISOString().split('T')[0];
}

function getTodayKey() {
  return ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date().getDay()];
}

function getTomorrowKey() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  return ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][d.getDay()];
}

function emptyDayPlan() {
  return {
    breakfast: { sabjis: [] },
    lunch:     { curry: '', sabji: '', gujaratiSabji: '' },
    dinner:    { curry: '', sabjis: [], gujaratiSabji: '' }
  };
}

function isEmptyDayPlan(plan) {
  if (!plan) return true;
  const b = plan.breakfast?.sabjis?.length > 0;
  const l = plan.lunch?.curry || plan.lunch?.sabji;
  const d = plan.dinner?.curry || plan.dinner?.sabjis?.length > 0;
  return !b && !l && !d;
}

function loadWeeklyPlan() {
  try {
    const s = localStorage.getItem(STORAGE_KEY_PLAN);
    if (!s) return null;
    const plan = JSON.parse(s);
    // Week rollover detection
    const currentWeekStart = getWeekStartDate();
    if (plan.weekStartingDate && plan.weekStartingDate !== currentWeekStart) {
      // Save as last week before resetting
      try { localStorage.setItem(STORAGE_KEY_LASTWEEK, JSON.stringify(plan)); } catch {}
      const fresh = { weekStartingDate: currentWeekStart, days: {} };
      DAYS.forEach(d => { fresh.days[d] = emptyDayPlan(); });
      saveWeeklyPlan(fresh);
      return fresh;
    }
    return plan;
  } catch { return null; }
}

function saveWeeklyPlan(plan) {
  try { localStorage.setItem(STORAGE_KEY_PLAN, JSON.stringify(plan)); }
  catch { showToast('Storage full. Plan not saved.', 'error'); }
}

function seedPlanIfNeeded() {
  const existing = loadWeeklyPlan();
  if (!existing) {
    const plan = { weekStartingDate: getWeekStartDate(), days: {} };
    DAYS.forEach(d => { plan.days[d] = emptyDayPlan(); });
    saveWeeklyPlan(plan);
  }
}

function getDayPlan(dayKey) {
  const plan = loadWeeklyPlan();
  return (plan?.days?.[dayKey]) || emptyDayPlan();
}

function updateMealSlot(dayKey, meal, field, value) {
  const plan = loadWeeklyPlan() || { weekStartingDate: getWeekStartDate(), days: {} };
  if (!plan.days[dayKey]) plan.days[dayKey] = emptyDayPlan();
  plan.days[dayKey][meal][field] = value;
  saveWeeklyPlan(plan);
}

function copyDayPlan(fromKey, toKey) {
  const plan = loadWeeklyPlan() || { weekStartingDate: getWeekStartDate(), days: {} };
  plan.days[toKey] = JSON.parse(JSON.stringify(plan.days[fromKey] || emptyDayPlan()));
  saveWeeklyPlan(plan);
}

/* ═══════════════════════════════════════════════
   ASYNC IMAGE LOADING — populates placeholders
═══════════════════════════════════════════════ */
/* Resolve one image cell: URL field → IndexedDB blob → leave emoji.
   Reads data-img-url (hosted URL), data-img-id (dish blob key), data-ing-img (ingredient blob key). */
async function resolveImageEl(el) {
  const url = el.dataset.imgUrl;
  if (url) {
    el.innerHTML = `<img src="${url}" class="w-full h-full object-cover rounded-[8px]" alt="" referrerpolicy="no-referrer">`;
    return;
  }
  let blob = null;
  if (el.dataset.ingImg) blob = await getIngredientImage(el.dataset.ingImg);
  else if (el.dataset.imgId) blob = await getImageBlob(el.dataset.imgId);
  if (blob) {
    const u = URL.createObjectURL(blob);
    el.innerHTML = `<img src="${u}" class="w-full h-full object-cover rounded-[8px]" alt="">`;
  }
}

async function resolveImagesIn(container) {
  for (const el of container.querySelectorAll('[data-img-url],[data-img-id],[data-ing-img]')) {
    await resolveImageEl(el);
  }
}

// Back-compat wrappers (callers unchanged)
async function loadImagesIntoGrid(container) { await resolveImagesIn(container); }

async function loadImageIntoThumb(el, sabjiId) {
  const s = getSabjiById(sabjiId);
  if (s?.image) el.dataset.imgUrl = s.image;
  else el.dataset.imgId = sabjiId;
  await resolveImageEl(el);
}

/* ═══════════════════════════════════════════════
   INTEGRATIONS — LLM + image host config
═══════════════════════════════════════════════ */
function loadIntegrations() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY_INTEGRATIONS)) || {}; }
  catch { return {}; }
}
function saveIntegrations(cfg) {
  try { localStorage.setItem(STORAGE_KEY_INTEGRATIONS, JSON.stringify(cfg)); }
  catch { showToast('Storage full.', 'error'); }
}

/* imgbb upload → hosted URL. Returns null if no key configured (caller falls back to local blob). */
async function uploadToImgbb(file) {
  const cfg = loadIntegrations();
  if (!cfg.imgbbKey) return null;
  const compressed = await compressImage(file, 1024, 0.8);
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(compressed);
  });
  const fd = new FormData();
  fd.append('image', b64);
  const resp = await fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent(cfg.imgbbKey), { method: 'POST', body: fd });
  const json = await resp.json();
  if (!json.success) throw new Error(json.error?.message || 'imgbb upload failed');
  return json.data.url;
}

/* LLM auto-fill: returns {malayalam, gujarati} transliterated in English. OpenAI-compatible endpoint. */
async function callLLMForNames(ingredientName) {
  const cfg = loadIntegrations();
  if (!cfg.llmBaseUrl || !cfg.llmKey || !cfg.llmModel)
    throw new Error('Set LLM config in Settings → Integrations first.');
  const prompt = `You are a South Indian and Gujarati cooking expert. For the cooking ingredient "${ingredientName}", give its common Malayalam name and Gujarati name, both transliterated in English (Latin letters, no native script). Reply with ONLY valid JSON, no prose: {"malayalam":"...","gujarati":"..."}. If a name is unknown, use an empty string.`;
  const resp = await fetch(cfg.llmBaseUrl.replace(/\/+$/, '') + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.llmKey },
    body: JSON.stringify({ model: cfg.llmModel, temperature: 0.2, messages: [{ role: 'user', content: prompt }] })
  });
  if (!resp.ok) throw new Error('LLM error ' + resp.status);
  const data = await resp.json();
  const txt = data.choices?.[0]?.message?.content || '';
  const m = txt.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No JSON in LLM reply');
  const parsed = JSON.parse(m[0]);
  return { malayalam: (parsed.malayalam || '').trim(), gujarati: (parsed.gujarati || '').trim() };
}

function renderMealCard(dayKey, meal, mealData) {
  const icons = { breakfast:'🌅', lunch:'☀️', dinner:'🌙' };
  const labels = { breakfast:'Breakfast', lunch:'Lunch', dinner:'Dinner' };
  mealData = mealData || emptyDayPlan()[meal];

  let slots = '';
  if (meal === 'breakfast') {
    slots = `
      <span class="staple-chip">🫓 Chapati</span>
      ${renderSabjiSlot(dayKey, meal, 'sabjis', mealData.sabjis, 0)}
      ${(mealData.sabjis[0]) ? renderSabjiSlot(dayKey, meal, 'sabjis', mealData.sabjis, 1) : ''}
    `;
  } else if (meal === 'lunch') {
    slots = `
      <span class="staple-chip">🍚 Rice</span>
      ${renderCurrySlot(dayKey, meal, mealData.curry)}
      ${renderSabjiSlot(dayKey, meal, 'sabji', mealData.sabji, 0)}
      ${renderGujaratiSlot(dayKey, meal, mealData.gujaratiSabji)}
    `;
  } else {
    const sabjis = mealData.sabjis || [];
    slots = `
      <span class="staple-chip">🍚 Rice</span>
      ${renderCurrySlot(dayKey, meal, mealData.curry)}
      ${renderSabjiSlot(dayKey, meal, 'sabjis', sabjis, 0)}
      ${sabjis[0] ? renderSabjiSlot(dayKey, meal, 'sabjis', sabjis, 1) : ''}
      ${renderGujaratiSlot(dayKey, meal, mealData.gujaratiSabji)}
    `;
  }

  return `
    <div class="tx-card p-4 mb-3">
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xl">${icons[meal]}</span>
        <h2 class="text-base font-bold" style="font-family:'Syne',sans-serif;color:#1A4731">${labels[meal]}</h2>
      </div>
      <div class="flex flex-wrap gap-2">${slots}</div>
    </div>`;
}

function bindMealCardEvents(dayKey, container) {
  container.addEventListener('click', e => {
    const addBtn = e.target.closest('.add-sabji-btn');
    if (addBtn) {
      const { day, meal, field, index, filter } = addBtn.dataset;
      _pickerContext = { day, meal, field, index: parseInt(index), filter: filter || null };
      openSabjiPicker(filter || null);
      return;
    }
    const changeBtn = e.target.closest('.change-sabji-btn');
    if (changeBtn) {
      const { day, meal, field, index, filter } = changeBtn.dataset;
      _pickerContext = { day, meal, field, index: parseInt(index), filter: filter || null };
      openSabjiPicker(filter || null);
      return;
    }
    const gujaratiBtn = e.target.closest('.add-gujarati-btn');
    if (gujaratiBtn) {
      const { day, meal } = gujaratiBtn.dataset;
      _pickerContext = { day, meal, field: 'gujaratiSabji', index: 0, filter: 'gujarati' };
      openSabjiPicker('gujarati');
      return;
    }
    const removeGuj = e.target.closest('.remove-gujarati-btn');
    if (removeGuj) {
      const { day, meal } = removeGuj.dataset;
      updateMealSlot(day, meal, 'gujaratiSabji', '');
      renderDayView(day, container.id === 'tab-today' ? 'tab-today' : 'tab-tomorrow');
      return;
    }
    const missingBtn = e.target.closest('.missing-ingredient-btn');
    if (missingBtn) {
      const { sabjiId, day, meal, field, index } = missingBtn.dataset;
      _pickerContext = { day, meal, field, index: parseInt(index) };
      openMissingIngredientOverlay(sabjiId);
      return;
    }
    const recipeBtn = e.target.closest('.recipe-view-btn');
    if (recipeBtn) {
      openRecipeView(recipeBtn.dataset.sabjiId);
      return;
    }
  });
}

  loadImagesIntoGrid(container);

  document.getElementById('tomorrow-ing-btn')?.addEventListener('click', () => openIngredientsNeeded(tKey));

    copyDayPlan(todayKey, tKey);
    renderNextDayView();
    showToast("Copied today's plan to tomorrow!", 'success');
  });

    updateMealSlot(tKey, 'breakfast', 'sabjis', []);

    updateMealSlot(tKey, 'lunch', 'gujaratiSabji', '');
    updateMealSlot(tKey, 'dinner', 'curry', '');
    updateMealSlot(tKey, 'dinner', 'sabjis', []);
    updateMealSlot(tKey, 'dinner', 'gujaratiSabji', '');
    renderNextDayView();
  });
}

/* ═══════════════════════════════════════════════
   WEEK VIEW
═══════════════════════════════════════════════ */
function getMealSummary(dayPlan) {
  if (!dayPlan) return ['—', '—', '—'];
  const getNames = ids => (ids||[]).map(id => { const s = getSabjiById(id); return s ? s.name : null; }).filter(Boolean);
  const b = getNames(dayPlan.breakfast?.sabjis);
  const l = [dayPlan.lunch?.curry, dayPlan.lunch?.sabji].filter(Boolean).map(id => { const s = getSabjiById(id); return s?.name; }).filter(Boolean);
  const d = [dayPlan.dinner?.curry, ...(dayPlan.dinner?.sabjis||[])].filter(Boolean).map(id => { const s = getSabjiById(id); return s?.name; }).filter(Boolean);
  return [b.join(', ')||'—', l.join(', ')||'—', d.join(', ')||'—'];
}

function renderWeekView() {
  const container = document.getElementById('tab-week');
  const plan = loadWeeklyPlan() || {};
  const todayKey = getTodayKey();
  const hasLastWeek = !!localStorage.getItem(STORAGE_KEY_LASTWEEK);

  container.innerHTML = `
    <div class="px-4 pt-1">
      <div class="flex items-center justify-between mb-3">
        <p class="tx-panel-label">This Week</p>
        <div class="flex gap-2">
          ${hasLastWeek ? `<button id="use-lastweek-btn" class="tx-outline-btn px-3 py-1.5 text-xs">Use Last Week</button>` : ''}
          <button id="shopping-list-btn" class="tx-outline-btn px-3 py-1.5 text-xs">🧾 Ingredients</button>
        </div>
      </div>
      <div class="flex flex-col gap-2.5">
        ${DAYS.map(day => {
          const dp = plan.days?.[day] || emptyDayPlan();
          const [b, l, d] = getMealSummary(dp);
          const isToday = day === todayKey;
          return `
            <div class="week-day-row tx-card p-3 cursor-pointer active:scale-[0.98] transition-transform ${isToday ? 'ring-2 ring-green-accent' : ''}"
                 data-day="${day}">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-sm font-bold" style="color:${isToday ? '#1A4731' : '#1A4731'};font-family:'Syne',sans-serif">${DAY_FULL[day]}${isToday ? ' · Today' : ''}</span>
                ${isToday ? '<span class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:#F5E642;color:#1A4731;border:1.5px solid #1A4731">Now</span>' : '<span style="color:#4A5E50" class="text-sm">→</span>'}
              </div>
              <div class="flex flex-col gap-0.5">
                <div class="flex gap-1.5 text-xs tx-copy"><span class="text-base leading-none">🌅</span><span class="truncate">${b}</span></div>
                <div class="flex gap-1.5 text-xs tx-copy"><span class="text-base leading-none">☀️</span><span class="truncate">${l}</span></div>
                <div class="flex gap-1.5 text-xs tx-copy"><span class="text-base leading-none">🌙</span><span class="truncate">${d}</span></div>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;

  container.querySelectorAll('.week-day-row').forEach(row => {
    row.addEventListener('click', () => {
      const dayKey = row.dataset.day;
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('tab-today').classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active','text-green-accent');
        b.classList.add('text-muted');
        b.querySelector('.tab-icon').classList.remove('bg-green-light');
      });
      const todayBtn = document.querySelector('[data-tab="today"]');
      todayBtn.classList.add('active','text-green-accent');
      todayBtn.classList.remove('text-muted');
      todayBtn.querySelector('.tab-icon').classList.add('bg-green-light');
      renderDayView(dayKey, 'tab-today');
    });
  });

  document.getElementById('shopping-list-btn')?.addEventListener('click', () => openIngredientsNeeded('week'));
  document.getElementById('use-lastweek-btn')?.addEventListener('click', () => {
    if (confirm('Replace this week\'s plan with last week\'s?')) {
      try {
        const last = JSON.parse(localStorage.getItem(STORAGE_KEY_LASTWEEK));
        const plan = loadWeeklyPlan() || { weekStartingDate: getWeekStartDate(), days: {} };
        plan.days = last.days;
        saveWeeklyPlan(plan);
        renderWeekView();
        showToast('Last week\'s plan loaded!', 'success');
      } catch { showToast('Could not load last week.', 'error'); }
    }
  });
}

function renderSabjiGrid(sabjis) {
  if (!sabjis.length) return `<div class="col-span-2 tx-empty mt-8 text-sm">No sabjis found.</div>`;
  return sabjis.map(s => `
    <button class="sabji-pick-card tx-card p-3 text-left active:scale-95 transition-transform"
            data-sabji-id="${s.id}">
      <div class="w-full h-24 rounded-[8px] mb-2 flex items-center justify-center text-4xl overflow-hidden"
           style="background:${s.bgColor||'#f5f5f5'}" data-img-id="${s.id}">${s.emoji||'🥗'}</div>
      <p class="text-sm font-bold leading-tight" style="color:#1A4731">${s.name}</p>
      <p class="text-xs mt-0.5 capitalize tx-copy">${s.category}</p>
    </button>`).join('');
}

function bindPickerGridEvents(gridEl) {
  gridEl.querySelectorAll('.sabji-pick-card').forEach(card => {
    card.addEventListener('click', () => {
      const sabjiId = card.dataset.sabjiId;
      if (_pickerContext) {
        const { day, meal, field, index } = _pickerContext;
        if (field === 'sabjis') {
          const dp = getDayPlan(day);
          const arr = [...(dp[meal].sabjis || [])];
          arr[index] = sabjiId;
          updateMealSlot(day, meal, 'sabjis', arr);
        } else {
          updateMealSlot(day, meal, field, sabjiId);
        }
      }
      removeOverlay('sabji-picker-overlay');
      removeOverlay('suggestion-results-overlay');
      removeOverlay('missing-ingredient-overlay');
      refreshCurrentTab();
    });
  });
}

    s.mainIngredients.every(i => avail.has(i.toLowerCase()))

}

/* ═══════════════════════════════════════════════
   MISSING INGREDIENT HANDLER
═══════════════════════════════════════════════ */
function handleMissingIngredient(sabjiId) {
  const repo = loadSabjiRepo() || [];
  const original = repo.find(s => s.id === sabjiId);
  if (!original) return [];
  const staples = getStaplesSet();
  const origSet = new Set(original.mainIngredients.map(i => i.toLowerCase()));
  return repo.filter(s => {
    if (s.id === sabjiId) return false;
    return s.mainIngredients.some(i => {
      const l = i.toLowerCase();
      return !staples.has(l) && origSet.has(l);
    });
  });
}

function openMissingIngredientOverlay(sabjiId) {
  removeOverlay('missing-ingredient-overlay');
  const original = getSabjiById(sabjiId);
  const alts = handleMissingIngredient(sabjiId);

  const overlay = document.createElement('div');
  overlay.id = 'missing-ingredient-overlay';
  overlay.className = 'fixed inset-0 z-50 tx-overlay flex flex-col max-w-[430px] mx-auto overlay-enter';

        : `<div class="grid grid-cols-2 gap-3">${renderSabjiGrid(alts)}</div>`

    </div>`;

  document.getElementById('app').appendChild(overlay);

  const grid = overlay.querySelector('.grid');
  if (grid) { bindPickerGridEvents(grid); loadImagesIntoGrid(grid); }
}

const ADMIN_SECTIONS = [
  { key:'sabji',    label:'Sabjis' },
  { key:'curry',    label:'Curries' },
  { key:'gujarati', label:'Gujarati' },
  { key:'ingredients', label:'Ingredients' },
  { key:'integrations', label:'Integrations' },
  { key:'data',     label:'Import/Export' },
];
const CAT_LABEL = { sabji:'Sabji', curry:'Curry', gujarati:'Gujarati Sabji' };
let _adminSection = 'sabji';

function openAdminOverlay() {
  removeOverlay('admin-overlay');
  _adminSection = 'sabji';

      ${ADMIN_SECTIONS.map(s => `

          data-section="${s.key}"

function renderAdminBody() {
  const body = document.getElementById('admin-body');
  if (!body) return;

  if (_adminSection === 'data') { renderAdminData(body); return; }
  if (_adminSection === 'integrations') { renderAdminIntegrations(body); return; }

  if (_adminSection === 'ingredients') {
    const ingredients = loadIngredients() || [];
    const staples = loadStaples() || DEFAULT_STAPLES;
    const missing = ingredients.filter(i => !i.malayalam || !i.gujarati).length;
    body.innerHTML = `
      <div class="flex gap-2 mb-4">
        <button id="admin-add-ingredient" class="btn-primary flex-1 py-3 text-sm active:scale-95 transition-transform">+ Add</button>
        <button id="admin-fill-names" class="rounded-pill px-4 py-3 text-sm font-semibold" style="border:1.5px solid #1A4731;color:#1A4731">✨ Fill names${missing ? ` (${missing})` : ''}</button>
      </div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Ingredients (${ingredients.length})</p>
      <div class="grid grid-cols-2 gap-3" id="admin-ing-list">
        ${ingredients.map(i => renderIngredientCard(i, 'admin-ing-card')).join('')}
      </div>

      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mt-7 mb-3">Staples (always on hand)</p>
      <p class="text-xs mb-3" style="color:#4A5E50">Never shown in shopping lists — assumed always available.</p>
      <div id="staples-tags" class="flex flex-wrap gap-2 mb-3">
        ${staples.map(s => renderStapleTag(s)).join('')}
      </div>
      <div class="flex gap-2">
        <input id="new-staple-input" type="text" placeholder="Add staple (e.g. coconut milk)"
          class="flex-1 border border-gray-200 rounded-[10px] px-3 py-2.5 text-sm outline-none focus:border-green-accent">
        <button id="add-staple-btn" class="btn-primary rounded-pill px-5 py-2.5 text-sm">Add</button>
      </div>`;

    body.querySelector('#admin-add-ingredient').addEventListener('click', () => openIngredientEditor(null, 'admin'));
    body.querySelectorAll('.admin-ing-card').forEach(card => {
      card.addEventListener('click', () => openIngredientEditor(card.dataset.ingName, 'admin'));
    });
    (async () => { const g = body.querySelector('#admin-ing-list'); await resolveImagesIn(g); revealCardEmojis(g); })();

    // Bulk fill Malayalam/Gujarati names via LLM
    body.querySelector('#admin-fill-names').addEventListener('click', async () => {
      const cfg = loadIntegrations();
      if (!cfg.llmBaseUrl || !cfg.llmKey || !cfg.llmModel) {
        showToast('Set LLM config in Integrations first.', 'error'); return;
      }
      const list = loadIngredients() || [];
      const todo = list.filter(i => !i.malayalam || !i.gujarati);
      if (!todo.length) { showToast('All names already filled.', 'info'); return; }
      const btn = body.querySelector('#admin-fill-names');
      btn.disabled = true;
      let done = 0;
      for (const ing of todo) {
        try {
          const r = await callLLMForNames(ing.name);
          if (!ing.malayalam) ing.malayalam = r.malayalam;
          if (!ing.gujarati) ing.gujarati = r.gujarati;
          done++;
          btn.textContent = `✨ Filling ${done}/${todo.length}…`;
          saveIngredients(list);
        } catch (e) { console.warn('fill failed for', ing.name, e); }
        await new Promise(r => setTimeout(r, 400));
      }
      saveIngredients(list);
      showToast(`Filled names for ${done}/${todo.length}.`, done ? 'success' : 'error');
      renderAdminBody();
    });

    // Staples add/remove
    body.querySelector('#add-staple-btn').addEventListener('click', () => {
      const inp = body.querySelector('#new-staple-input');
      const val = inp.value.trim().toLowerCase();
      if (!val) return;
      const cur = loadStaples() || DEFAULT_STAPLES;
      if (cur.includes(val)) { showToast('Already in staples.', 'info'); return; }
      cur.push(val); saveStaples(cur);
      const tags = body.querySelector('#staples-tags');
      tags.insertAdjacentHTML('beforeend', renderStapleTag(val));
      bindStapleTagEvents(tags.lastElementChild);
      inp.value = '';
    });

function bindAdminRowEvents(row) {
  const sabjiId = row.dataset.sabjiId;

  row.querySelector('.sabji-img-upload').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const thumb = row.querySelector('[data-img-id]');
    try {
      const hosted = await uploadToImgbb(file);
      if (hosted) {
        const repo = loadSabjiRepo() || [];
        const it = repo.find(r => r.id === sabjiId);
        if (it) { it.image = hosted; saveSabjiRepo(repo); await deleteImageBlob(sabjiId); }
        thumb.dataset.imgUrl = hosted; await resolveImageEl(thumb);
        showToast('Uploaded to imgbb.', 'success');
      } else {
        const blob = await compressImage(file);
        await saveImageBlob(sabjiId, blob);
        delete thumb.dataset.imgUrl; thumb.dataset.imgId = sabjiId; await resolveImageEl(thumb);
        showToast('Photo saved locally.', 'success');
      }
    } catch (err) {
      showToast(err.message || 'Image failed to process.', 'error');
    }
    e.target.value = '';
  });

  row.querySelector('.edit-sabji-btn').addEventListener('click', () => {
    const s = getSabjiById(sabjiId);
    openDishEditor(sabjiId, s?.category || 'sabji');
  });

  row.querySelector('.delete-sabji-btn').addEventListener('click', () => {
    const s = getSabjiById(sabjiId);
    if (!confirm(`Delete "${s?.name}"? This cannot be undone.`)) return;
    const repo = (loadSabjiRepo() || []).filter(r => r.id !== sabjiId);
    saveSabjiRepo(repo);
    deleteImageBlob(sabjiId);
    row.remove();
    showToast('Deleted.', 'info');
  });
}

  });
}

/* ── Import / Export ── */
function buildExportPayload() {
  return {
    version: 1,
    sabjis: (loadSabjiRepo() || []).map(s => ({
      id:s.id, name:s.name, category:s.category, mainIngredients:s.mainIngredients||[],
      emoji:s.emoji||'', recipe:s.recipe||'', youtube:s.youtube||'', referenceText:s.referenceText||'', image:s.image||''
    })),
    ingredients: (loadIngredients() || []).map(i => ({
      name:i.name, emoji:i.emoji||'', malayalam:i.malayalam||'', gujarati:i.gujarati||'', image:i.image||''
    })),
    staples: loadStaples() || DEFAULT_STAPLES,
  };
}

function applyImport(data) {
  if (!data || data.version !== 1) throw new Error('Unsupported or missing version.');
  let dishAdd = 0, dishUpd = 0, ingAdd = 0, ingUpd = 0;

  if (Array.isArray(data.sabjis)) {
    const repo = loadSabjiRepo() || [];
    const byId = new Map(repo.map(s => [s.id, s]));
    const bgColors = { sabji:'#D4EDDA', curry:'#FFF3CD', gujarati:'#E2D9F3' };
    data.sabjis.forEach(s => {
      if (!s.name || !s.category) return;
      const id = s.id || (s.name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') + '-' + Date.now().toString(36));
      const incoming = {
        id, name:s.name, category:s.category, mainIngredients:s.mainIngredients||[],
        emoji:s.emoji||'🥗', bgColor:byId.get(id)?.bgColor||bgColors[s.category]||'#f5f5f5',
        referenceText:s.referenceText||'', recipe:s.recipe||'', youtube:s.youtube||'', image:s.image||''
      };
      if (byId.has(id)) { Object.assign(byId.get(id), incoming); dishUpd++; }
      else { repo.push(incoming); byId.set(id, incoming); dishAdd++; }
    });
    saveSabjiRepo(repo);
  }

  if (Array.isArray(data.ingredients)) {
    const list = loadIngredients() || [];
    const byName = new Map(list.map(i => [i.name.toLowerCase(), i]));
    data.ingredients.forEach(i => {
      if (!i.name) return;
      const key = i.name.toLowerCase();
      const incoming = { name:i.name, emoji:i.emoji||INGREDIENT_EMOJI_MAP[key]||'🥗', malayalam:i.malayalam||'', gujarati:i.gujarati||'', image:i.image||'' };
      if (byName.has(key)) { Object.assign(byName.get(key), incoming); ingUpd++; }
      else { list.push(incoming); byName.set(key, incoming); ingAdd++; }
    });
    list.sort((a,b) => a.name.localeCompare(b.name));
    saveIngredients(list);
  }

  if (Array.isArray(data.staples)) {
    const cur = loadStaples() || [];
    const merged = [...new Set([...cur, ...data.staples.map(s => String(s).toLowerCase())])];
    saveStaples(merged);
  }

  syncIngredientsFromRepo();
  return { dishAdd, dishUpd, ingAdd, ingUpd };
}

function renderAdminData(body) {
  const json = JSON.stringify(buildExportPayload(), null, 2);
  body.innerHTML = `
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Export</p>
    <p class="text-xs mb-2" style="color:#4A5E50">Download or copy your full cookbook (sabjis, curries, ingredients, staples).</p>
    <div class="flex gap-2 mb-3">
      <button id="data-download" class="btn-primary flex-1 py-2.5 text-sm active:scale-95 transition-transform">⬇ Download JSON</button>
      <button id="data-copy" class="rounded-pill px-4 py-2.5 text-sm font-semibold" style="border:1.5px solid #1A4731;color:#1A4731">Copy</button>
    </div>
    <textarea id="data-export-text" readonly rows="6"
      class="w-full border border-gray-200 rounded-[10px] px-3 py-2.5 text-xs outline-none mb-6 font-mono" style="resize:vertical">${json.replace(/</g,'&lt;')}</textarea>

    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Import</p>
    <p class="text-xs mb-2" style="color:#4A5E50">Upload a JSON file or paste below. Existing items are updated, new ones added — nothing is deleted.</p>
    <label class="btn-primary w-full py-3 text-sm mb-2 cursor-pointer active:scale-95 transition-transform inline-flex justify-center">
      📁 Choose JSON File
      <input id="data-file" type="file" accept="application/json,.json" class="hidden">
    </label>
    <textarea id="data-import-text" placeholder='Paste JSON here…' rows="6"
      class="w-full border border-gray-200 rounded-[10px] px-3 py-2.5 text-xs outline-none mb-2 font-mono" style="resize:vertical"></textarea>
    <button id="data-import-btn" class="btn-primary w-full py-3 text-sm active:scale-95 transition-transform">Import Pasted JSON</button>`;

  body.querySelector('#data-download').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(buildExportPayload(), null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'moms-kitchen-cookbook.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded.', 'success');
  });
  body.querySelector('#data-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(body.querySelector('#data-export-text').value); showToast('Copied!', 'success'); }
    catch { body.querySelector('#data-export-text').select(); showToast('Select + copy manually.', 'info'); }
  });

  const runImport = (text) => {
    let data;
    try { data = JSON.parse(text); }
    catch { showToast('Invalid JSON.', 'error'); return; }
    try {
      const r = applyImport(data);
      showToast(`Imported: +${r.dishAdd} dishes, ${r.dishUpd} updated, +${r.ingAdd} ingredients.`, 'success');
      renderAdminData(body);
    } catch (e) { showToast(e.message || 'Import failed.', 'error'); }
  };

  body.querySelector('#data-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => runImport(String(reader.result));
    reader.onerror = () => showToast('Could not read file.', 'error');
    reader.readAsText(file);
    e.target.value = '';
  });
  body.querySelector('#data-import-btn').addEventListener('click', () => {
    const text = body.querySelector('#data-import-text').value.trim();
    if (!text) { showToast('Paste JSON first.', 'error'); return; }
    runImport(text);
  });
}

  const setPreview = src => { preview.innerHTML = `<img src="${src}" class="w-full h-full object-cover rounded-[12px]" alt="" referrerpolicy="no-referrer">`; };

  let _pendingBlob = null;
  let _pendingImageUrl = existing?.image || '';

  if (existing?.image) setPreview(existing.image);
  else if (name) {
    getIngredientImage(name).then(blob => { if (blob) setPreview(URL.createObjectURL(blob)); });
  }

  overlay.querySelector('#ie-image-url').addEventListener('input', e => {
    _pendingImageUrl = e.target.value.trim();
    _pendingBlob = null;
    if (_pendingImageUrl) setPreview(_pendingImageUrl);
  });

  overlay.querySelector('#ie-photo-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const hosted = await uploadToImgbb(file);   // null if no imgbb key → local blob fallback
      if (hosted) {
        _pendingImageUrl = hosted; _pendingBlob = null;
        overlay.querySelector('#ie-image-url').value = hosted;
        setPreview(hosted);
        showToast('Uploaded to imgbb.', 'success');
      } else {
        _pendingBlob = await compressImage(file); _pendingImageUrl = '';
        setPreview(URL.createObjectURL(_pendingBlob));
        showToast('Saved locally (no imgbb key set).', 'info');
      }
    } catch (err) { showToast(err.message || 'Image failed.', 'error'); }
    e.target.value = '';
  });

  overlay.querySelector('#ie-autofill').addEventListener('click', async () => {
    const nm = overlay.querySelector('#ie-name').value.trim();
    if (!nm) { showToast('Enter a name first.', 'error'); return; }
    const btn = overlay.querySelector('#ie-autofill');
    const orig = btn.textContent; btn.textContent = '✨ Thinking…'; btn.disabled = true;
    try {
      const r = await callLLMForNames(nm);
      if (r.malayalam) overlay.querySelector('#ie-malayalam').value = r.malayalam;
      if (r.gujarati) overlay.querySelector('#ie-gujarati').value = r.gujarati;
      showToast('Names filled — review + save.', 'success');
    } catch (e) { showToast(e.message || 'Auto-fill failed.', 'error'); }
    btn.textContent = orig; btn.disabled = false;
  });

  overlay.querySelector('#ie-save-btn').addEventListener('click', async () => {
    const newName = overlay.querySelector('#ie-name').value.trim();
    const newEmoji = overlay.querySelector('#ie-emoji').value.trim() || INGREDIENT_EMOJI_MAP[newName.toLowerCase()] || '🥗';
    const malayalam = overlay.querySelector('#ie-malayalam').value.trim();
    const gujarati = overlay.querySelector('#ie-gujarati').value.trim();
    if (!newName) { showToast('Enter a name.', 'error'); return; }

    const imageVal = _pendingImageUrl ? _pendingImageUrl : (_pendingBlob ? '' : (existing?.image || ''));

    const list = loadIngredients() || [];
    if (isNew) {
      if (list.find(i => i.name.toLowerCase() === newName.toLowerCase())) {
        showToast('Already in pantry.', 'info'); return;
      }
      list.push({ name: newName, emoji: newEmoji, malayalam, gujarati, image: imageVal });
    } else {
      const idx = list.findIndex(i => i.name === name);
      if (idx >= 0) {
        if (newName !== name && !_pendingBlob) {
          const oldBlob = await getIngredientImage(name);
          if (oldBlob) { await saveIngredientImage(newName, oldBlob); await deleteIngredientImage(name); }
        }
        list[idx] = { name: newName, emoji: newEmoji, malayalam, gujarati, image: imageVal };

    list.sort((a, b) => a.name.localeCompare(b.name));
    saveIngredients(list);

    else if (_pendingImageUrl) await deleteIngredientImage(newName);  // URL replaces any local blob

    refreshOrigin();
    showToast(isNew ? `${newName} added!` : 'Updated!', 'success');

    saveIngredients(list);
    await deleteIngredientImage(name);
    removeOverlay('ingredient-editor-overlay');
    refreshOrigin();
    showToast('Deleted.', 'info');
  });
}

═══════════════════════════════════════════════ */
function computeIngredientsNeeded(scope) {
  const staples = getStaplesSet();
  const plan = loadWeeklyPlan();

  let dayKeys = [];
  if (scope === 'today') dayKeys = [getTodayKey()];
  else if (scope === 'tomorrow') dayKeys = [getTomorrowKey()];
  else if (scope === 'week') dayKeys = DAYS;
  else if (DAYS.includes(scope)) dayKeys = [scope];
  else dayKeys = DAYS;

  const mealCounts = { breakfast: {}, lunch: {}, dinner: {} };

  if (plan?.days) {
    dayKeys.forEach(day => {
      const dp = plan.days[day] || emptyDayPlan();
      const mealIds = {
        breakfast: (dp.breakfast?.sabjis || []),
        lunch: [dp.lunch?.curry, dp.lunch?.sabji, dp.lunch?.gujaratiSabji].filter(Boolean),
        dinner: [dp.dinner?.curry, ...(dp.dinner?.sabjis || []), dp.dinner?.gujaratiSabji].filter(Boolean),
      };
      Object.entries(mealIds).forEach(([meal, ids]) => {
        ids.forEach(id => {
          const s = getSabjiById(id);
          if (!s) return;
          s.mainIngredients.forEach(ing => {
            if (!staples.has(ing.toLowerCase())) {
              mealCounts[meal][ing] = (mealCounts[meal][ing] || 0) + 1;
            }
          });
        });
      });
    });
  }

  const total = {};
  Object.values(mealCounts).forEach(mealObj => {
    Object.entries(mealObj).forEach(([ing, count]) => {
      total[ing] = (total[ing] || 0) + count;
    });
  });

  return { ...mealCounts, total };
}

function generatePlanFromFridge(available, includeGujarati) {
  let makeable = suggestSabjisFromIngredients(available);
  if (!includeGujarati) makeable = makeable.filter(s => s.category !== 'gujarati');

  const sabjis    = makeable.filter(s => s.category === 'sabji');
  const curries   = makeable.filter(s => s.category === 'curry');
  const gujaratis = makeable.filter(s => s.category === 'gujarati');

  const shuffle = arr => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const sShuffle = shuffle(sabjis);
  const cShuffle = shuffle(curries);
  const gShuffle = shuffle(gujaratis);

  let sIdx = 0, cIdx = 0, gIdx = 0, filledCount = 0;

  const fillDay = (dayKey) => {
    const dp = getDayPlan(dayKey);

    // Breakfast: up to 2 sabjis
    if (!dp.breakfast?.sabjis?.[0] && sShuffle[sIdx]) {
      updateMealSlot(dayKey, 'breakfast', 'sabjis', [sShuffle[sIdx++].id]);
      filledCount++;
    }
    if (getDayPlan(dayKey).breakfast?.sabjis?.[0] && !getDayPlan(dayKey).breakfast?.sabjis?.[1] && sShuffle[sIdx]) {
      const arr = [...getDayPlan(dayKey).breakfast.sabjis];
      arr[1] = sShuffle[sIdx++].id;
      updateMealSlot(dayKey, 'breakfast', 'sabjis', arr);
      filledCount++;
    }

    // Lunch
    if (!getDayPlan(dayKey).lunch?.curry && cShuffle[cIdx]) {
      updateMealSlot(dayKey, 'lunch', 'curry', cShuffle[cIdx++].id);
      filledCount++;
    }
    if (!getDayPlan(dayKey).lunch?.sabji && sShuffle[sIdx]) {
      updateMealSlot(dayKey, 'lunch', 'sabji', sShuffle[sIdx++].id);
      filledCount++;
    }
    if (includeGujarati && !getDayPlan(dayKey).lunch?.gujaratiSabji && gShuffle[gIdx]) {
      updateMealSlot(dayKey, 'lunch', 'gujaratiSabji', gShuffle[gIdx++].id);
      filledCount++;
    }

    // Dinner
    if (!getDayPlan(dayKey).dinner?.curry && cShuffle[cIdx]) {
      updateMealSlot(dayKey, 'dinner', 'curry', cShuffle[cIdx++].id);
      filledCount++;
    }
    if (!getDayPlan(dayKey).dinner?.sabjis?.[0] && sShuffle[sIdx]) {
      updateMealSlot(dayKey, 'dinner', 'sabjis', [sShuffle[sIdx++].id]);
      filledCount++;
    }
    if (getDayPlan(dayKey).dinner?.sabjis?.[0] && !getDayPlan(dayKey).dinner?.sabjis?.[1] && sShuffle[sIdx]) {
      const arr = [...getDayPlan(dayKey).dinner.sabjis];
      arr[1] = sShuffle[sIdx++].id;
      updateMealSlot(dayKey, 'dinner', 'sabjis', arr);
      filledCount++;
    }
    if (includeGujarati && !getDayPlan(dayKey).dinner?.gujaratiSabji && gShuffle[gIdx]) {
      updateMealSlot(dayKey, 'dinner', 'gujaratiSabji', gShuffle[gIdx++].id);
      filledCount++;
    }
  };

  fillDay(getTodayKey());
  fillDay(getTomorrowKey());

  // Switch to today tab
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('tab-today').classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.remove('active', 'text-green-accent');
    b.classList.add('text-muted');
    b.querySelector('.tab-icon').classList.remove('bg-green-light');
  });
  const todayBtn = document.querySelector('[data-tab="today"]');
  todayBtn.classList.add('active', 'text-green-accent');
  todayBtn.classList.remove('text-muted');
  todayBtn.querySelector('.tab-icon').classList.add('bg-green-light');
  renderDayView(getTodayKey(), 'tab-today');

  if (makeable.length === 0) {
    showToast('Nothing makeable with those ingredients. Try checking more.', 'info');
  } else if (filledCount === 0) {
    showToast('All slots already filled!', 'info');
  } else {
    showToast(`Added ${filledCount} dish${filledCount > 1 ? 'es' : ''} to today & tomorrow!`, 'success');
  }
}

    banner.classList.add('flex');
  });

  document.getElementById('install-btn').addEventListener('click', async () => {
    if (!_deferredInstall) return;
    _deferredInstall.prompt();
    const { outcome } = await _deferredInstall.userChoice;
    if (outcome === 'accepted') {
      document.getElementById('install-banner').classList.add('hidden');
    }
    _deferredInstall = null;
  });

  document.getElementById('install-dismiss').addEventListener('click', () => {
    document.getElementById('install-banner').classList.add('hidden');
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
}

/* ═══════════════════════════════════════════════
   HEADER DATE
═══════════════════════════════════════════════ */
function setHeaderDate() {
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-IN', opts);
}

/* ═══════════════════════════════════════════════
   WEEK ROLLOVER TOAST
═══════════════════════════════════════════════ */
function checkWeekRolloverToast() {
  const lastWeek = localStorage.getItem(STORAGE_KEY_LASTWEEK);
  if (lastWeek) {
    const plan = JSON.parse(lastWeek);
    if (plan.weekStartingDate && plan.weekStartingDate !== getWeekStartDate()) {
      setTimeout(() => {
        showToast('New week! Tap "Week" → "Use Last Week" to copy last week\'s plan.', 'info');
      }, 1200);
    }
  }
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
async function init() {
  await initImageDB();
  seedRepoIfNeeded();
  seedPlanIfNeeded();
  seedStaplesIfNeeded();
  seedIngredientsIfNeeded();
  setHeaderDate();
  initPWA();
  initTabs();
  checkWeekRolloverToast();

  document.getElementById('admin-btn').addEventListener('click', openAdminOverlay);

  // Activate today tab by default
  document.querySelector('[data-tab="today"]').click();
}

init();
</script>
